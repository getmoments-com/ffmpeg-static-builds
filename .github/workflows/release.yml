name: Build and release static ffmpeg

# Push a tag like `v8.1.2` to build that ffmpeg release and publish it as a GitHub Release
# with the ffmpeg-release-amd64-static.tar.xz asset (the name every consumer's Dockerfile pulls)
# plus its .sha256, which consumers should pin — release assets are re-uploadable, the pinned
# hash is what makes the pull tamper-evident.
# A tag suffix is allowed for rebuilds of the same version, e.g. `v8.1.2-nvenc2` -> ffmpeg 8.1.2.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'ffmpeg version to build (e.g. 8.1.2). Blank = Dockerfile default. Builds an artifact only, no release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # buildx + the GHA cache backend keep the dependency layers (x264, zimg, openssl, ...)
      # warm between builds, so a rebuild or an ffmpeg-only bump recompiles almost nothing.
      # ghaction-github-runtime exposes ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL to the raw
      # `docker buildx build` call in build-ubuntu.sh (docker/build-push-action would do this
      # implicitly, but we want CI and local builds to share the one build path).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub runtime for buildx cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Resolve ffmpeg version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME#v}"   # v8.1.2 -> 8.1.2
            ver="${ver%%-*}"             # v8.1.2-nvenc2 -> 8.1.2
          else
            ver="${{ github.event.inputs.ffmpeg_version }}"
          fi
          echo "ffmpeg_version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Building ffmpeg version: ${ver:-<Dockerfile default>}"

      # ubuntu-latest is amd64, so this is a native build (no QEMU emulation).
      - name: Build static ffmpeg
        env:
          EXTRA_BUILD_ARGS: --cache-from type=gha --cache-to type=gha,mode=max
        run: bash build-ubuntu.sh "${{ steps.version.outputs.ffmpeg_version }}"

      - name: Checksum the package
        run: |
          cd output
          sha256sum ffmpeg-release-amd64-static.tar.xz > ffmpeg-release-amd64-static.tar.xz.sha256
          cat ffmpeg-release-amd64-static.tar.xz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-release-amd64-static
          path: |
            output/ffmpeg-release-amd64-static.tar.xz
            output/ffmpeg-release-amd64-static.tar.xz.sha256

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            output/ffmpeg-release-amd64-static.tar.xz \
            output/ffmpeg-release-amd64-static.tar.xz.sha256 \
            --title "$GITHUB_REF_NAME" \
            --notes "Static ffmpeg/ffprobe (amd64, glibc-dynamic) with NVENC/NVDEC. ffmpeg ${{ steps.version.outputs.ffmpeg_version }}, built from ${GITHUB_SHA}. Pin the .sha256 in consumers. $(cat output/ffmpeg-release-amd64-static.tar.xz.sha256)"
